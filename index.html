<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="W.S.P.A."/>
<meta name="theme-color" content="#020d18"/>
<meta name="format-detection" content="telephone=no"/>
<title>JK Gaming — W.S.P.A. Command</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="scanline"></div>
<div id="root"></div>
<!-- Libraries are bundled in /vendor so the game works offline -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<!-- Save-data layer, then the game files in order (after saved data has loaded) -->
<script src="storage.js"></script>
<script>
(function(){
  var files=["data.js","logic.js","app.js"];
  function next(i){
    if(i>=files.length)return;
    var s=document.createElement("script");
    s.src=files[i];
    s.onload=function(){next(i+1);};
    s.onerror=function(){document.getElementById("root").textContent="Failed to load "+files[i];};
    document.body.appendChild(s);
  }
  gameStorage.ready.then(function(){next(0);});
})();
</script>
</body>
</html>
